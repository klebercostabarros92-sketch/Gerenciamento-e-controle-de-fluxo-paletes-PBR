<script>
  let dadosGlobais = [];
  let filtroStatusVP = 'TODOS';
  let filtroStatusProt = 'TODOS';

  document.addEventListener('DOMContentLoaded', () => {
    // Restore theme
    if (localStorage.getItem('thx-theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeLabel').innerText = 'Tema Claro';
      document.querySelector('.theme-toggle-btn .toggle-icon').innerText = '☀️';
    }
    atualizarDados();
  });

  /* ===== THEME TOGGLE ===== */
  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark');
    const label = document.getElementById('themeLabel');
    const icon = document.querySelector('.theme-toggle-btn .toggle-icon');
    if (isDark) {
      label.innerText = 'Tema Claro';
      icon.innerText = '☀️';
      localStorage.setItem('thx-theme', 'dark');
    } else {
      label.innerText = 'Tema Escuro';
      icon.innerText = '🌙';
      localStorage.setItem('thx-theme', 'light');
    }
    renderCharts();
  }

  /* ===== TABS ===== */
  function showTab(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sidebar .menu li').forEach(l => l.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    if (el) el.classList.add('active');
  }

  function showLoader() { document.getElementById('loader').style.display = 'flex'; }
  function hideLoader() { document.getElementById('loader').style.display = 'none'; }

  /* ===== DADOS ===== */
  function atualizarDados() {
    showLoader();
    google.script.run.withSuccessHandler(res => {
      const resp = JSON.parse(res);
      if (resp.success) {
        dadosGlobais = resp.data;
        renderDashboard();
        renderMonitoramento('TODOS');
        renderValePaletes();
        renderProtocolos();
        renderPrestacaoContas();
        renderCharts();
        const now = new Date();
        document.getElementById('ultimaAtualizacao').innerText =
          'Atualizado: ' + now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR');
      } else {
        alert('Erro ao carregar dados: ' + resp.error);
      }
      hideLoader();
    }).obterDadosCompletos();
  }

  /* ===== FORMATTERS ===== */
  function formatData(dataStr) {
    if (!dataStr) return '-';
    const d = new Date(dataStr);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR').substring(0, 5);
  }

  function formatMoney(value) {
    return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  /* ===== DASHBOARD ===== */
  function renderDashboard() {
    let devolvidos = 0, vpAtrasados = 0, vpNoPrazo = 0, vpComProtocolo = 0, paletesAtrasados = 0;
    dadosGlobais.forEach(reg => {
      if (reg.situacao === 'DEVOLVIDO')              { devolvidos       += reg.qtdePaletes; }
      if (reg.situacao === 'PENDENTE EM ATRASO')     { vpAtrasados++;      paletesAtrasados += reg.qtdePaletes; }
      if (reg.situacao === 'PENDENTE NO PRAZO')       { vpNoPrazo++; }
      if (reg.situacao === 'PENDENTE COM PROTOCOLO')  { vpComProtocolo++; }
    });
    document.getElementById('dash-devolvidos').innerText       = devolvidos;
    document.getElementById('dash-vp-atrasados').innerText     = vpAtrasados;
    document.getElementById('dash-vp-noprazo').innerText       = vpNoPrazo;
    document.getElementById('dash-vp-comprotocolo').innerText  = vpComProtocolo;
    document.getElementById('dash-paletes-atrasados').innerText = paletesAtrasados;
    document.getElementById('dash-valor-atrasado').innerText   = formatMoney(paletesAtrasados * 35);
  }

  /* ===== MONITORAMENTO ===== */
  function filtrarMonitoramento(filtro, el) {
    document.querySelectorAll('#tab-monitoramento .btn-filter').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
    renderMonitoramento(filtro);
  }

  function renderMonitoramento(filtro) {
    const tbody = document.querySelector('#table-monitoramento tbody');
    tbody.innerHTML = '';
    const filtrados = dadosGlobais.filter(reg => {
      if (reg.dataDevolucao) return false;
      if (reg.diasAberto > 3) return false;
      if (filtro === 'EMITIDOS ONTEM') return reg.emitidoOntem;
      if (filtro === 'DENTRO DO PRAZO') return reg.situacao === 'PENDENTE NO PRAZO';
      return true;
    });
    filtrados.forEach(reg => {
      tbody.innerHTML += `
        <tr>
          <td><strong>${reg.valePalete}</strong></td>
          <td>${formatData(reg.dataOcorrencia)}</td>
          <td>${reg.plano}</td>
          <td>${reg.cliente}</td>
          <td>${reg.placa}</td>
          <td>${reg.motorista}</td>
          <td>${reg.perfil}</td>
          <td>${reg.qtdePaletes}</td>
          <td><strong>${reg.numeroProtocolo || '-'}</strong></td>
          <td>${reg.diasAberto} dias</td>
          <td><span class="badge bg-yellow">${reg.cor} ${reg.situacao}</span></td>
        </tr>`;
    });
    if (filtrados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:30px;color:var(--text-light)">Nenhum registro encontrado.</td></tr>';
    }
  }

  /* ===== VALE-PALETES ===== */
  function filtrarVP(status, el) {
    filtroStatusVP = status;
    document.querySelectorAll('#tab-valepaletes .btn-filter').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
    renderValePaletes();
  }

  function renderValePaletes() {
    const tbody = document.querySelector('#table-valepaletes tbody');
    tbody.innerHTML = '';
    const texto = (document.getElementById('searchInput').value || '').toLowerCase();

    const filtrados = dadosGlobais.filter(reg => {
      // Status filter
      if (filtroStatusVP !== 'TODOS' && reg.situacao !== filtroStatusVP) return false;
      // Text search
      if (texto) {
        const haystack = [reg.valePalete, reg.motorista, reg.placa, reg.plano, reg.cliente]
          .map(v => String(v || '').toLowerCase()).join(' ');
        if (!haystack.includes(texto)) return false;
      }
      return true;
    });

    filtrados.forEach(reg => {
      let badge = 'bg-yellow';
      if (reg.situacao === 'DEVOLVIDO')             badge = 'bg-green';
      else if (reg.situacao === 'PENDENTE COM PROTOCOLO') badge = 'bg-blue';
      else if (reg.situacao === 'PENDENTE NO PRAZO')      badge = 'bg-yellow';
      else if (reg.situacao === 'PENDENTE EM ATRASO')     badge = 'bg-red';

      const statusMot = reg.statusMotorista || 'ATIVO';
      const statusMotClass = statusMot === 'INATIVO' ? 'mot-inativo' : 'mot-ativo';
      const temLink = Boolean(reg.linkAcao && reg.linkAcao.trim());
      const isProtocolado = Boolean(reg.temProtocolo || reg.situacao === 'PENDENTE COM PROTOCOLO');
      const foiSolicitado = Boolean(reg.solicitacaoLuiz);

      tbody.innerHTML += `
        <tr>
          <td><strong>${reg.valePalete}</strong></td>
          <td>${reg.plano}</td>
          <td>${formatData(reg.dataOcorrencia)}</td>
          <td>${reg.cliente}</td>
          <td>${reg.motorista}</td>
          <td>
            <select class="select-status-mot ${statusMotClass}" onchange="alterarStatusMotorista('${reg.valePalete}', this)">
              <option value="ATIVO" ${statusMot === 'ATIVO' ? 'selected' : ''}>🟢 Ativo</option>
              <option value="INATIVO" ${statusMot === 'INATIVO' ? 'selected' : ''}>🔴 Inativo</option>
            </select>
          </td>
          <td>${reg.placa}</td>
          <td>${reg.qtdePaletes}</td>
          <td><strong>${formatMoney(reg.qtdePaletes * 35)}</strong></td>
          <td><strong>${reg.numeroProtocolo || '-'}</strong></td>
          <td>${formatData(reg.dataDevolucao)}</td>
          <td><span class="badge ${badge}">${reg.cor} ${reg.situacao}</span></td>
          <td>
            <div class="col-acao-cell">
              <div class="input-link-wrapper">
                <input type="text" placeholder="Link tratativa..." value="${escapeHtml(reg.linkAcao || '')}"
                       onchange="salvarLinkTratativa('${reg.valePalete}', this.value)" class="input-link-acao" title="Cole o link da tratativa" />
                ${temLink ? `<a href="${encodeURI(reg.linkAcao)}" target="_blank" class="btn-open-link" title="Abrir link da tratativa"><i class="fas fa-external-link-alt"></i></a>` : ''}
              </div>
              ${isProtocolado ? `
                <button class="btn-solicitar-luiz ${foiSolicitado ? 'ja-enviado' : ''}" 
                        onclick="abrirModalEmailLuiz('${reg.valePalete}')" 
                        title="${foiSolicitado ? 'E-mail enviado em ' + reg.solicitacaoLuiz : 'Solicitar exclusão da pendência protocolada ao Luiz (luizhenrique@3coracoes.com.br)'}">
                  <i class="fas fa-paper-plane"></i> ${foiSolicitado ? 'Solicitado ✅' : 'Solicitar ao Luiz'}
                </button>
              ` : ''}
            </div>
          </td>
        </tr>`;
    });

    if (filtrados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;padding:30px;color:var(--text-light)">Nenhum registro encontrado.</td></tr>';
    }
  }

  /* ===== PROTOCOLOS ===== */
  function filtrarProtocolos(filtro, el) {
    filtroStatusProt = filtro;
    document.querySelectorAll('#tab-protocolos .btn-filter').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
    renderProtocolos();
  }

  function renderProtocolos() {
    const tbody = document.querySelector('#table-protocolos tbody');
    tbody.innerHTML = '';
    dadosGlobais.forEach(reg => {
      if (filtroStatusProt === 'SIM'  && !reg.temProtocolo) return;
      if (filtroStatusProt === 'NAO'  && reg.temProtocolo)  return;

      let badge = 'bg-orange', statusMsg = '🟠 NÃO LOCALIZADO', encMsg = 'NÃO';
      if (reg.temProtocolo) { badge = 'bg-green'; statusMsg = '🟢 LOCALIZADO'; encMsg = 'SIM'; }
      const foiSolicitado = Boolean(reg.solicitacaoLuiz);

      tbody.innerHTML += `
        <tr>
          <td><strong>${reg.valePalete}</strong></td>
          <td>${reg.plano}</td>
          <td>${formatData(reg.dataDevolucao)}</td>
          <td><strong>${reg.numeroProtocolo || '-'}</strong></td>
          <td>${encMsg}</td>
          <td><span class="badge ${badge}">${statusMsg}</span></td>
          <td>
            ${reg.temProtocolo ? `
              <button class="btn-solicitar-luiz ${foiSolicitado ? 'ja-enviado' : ''}" 
                      onclick="abrirModalEmailLuiz('${reg.valePalete}')" 
                      title="${foiSolicitado ? 'E-mail enviado em ' + reg.solicitacaoLuiz : 'Solicitar exclusão da pendência ao Luiz (luizhenrique@3coracoes.com.br)'}">
                <i class="fas fa-paper-plane"></i> ${foiSolicitado ? 'Solicitado ✅' : 'Solicitar ao Luiz'}
              </button>
            ` : '-'}
          </td>
        </tr>`;
    });
  }

  /* ===== PRESTAÇÃO DE CONTAS ===== */
  function renderPrestacaoContas() {
    let total = 0, devolvidos = 0, pendentes = 0, atrasados = 0;
    dadosGlobais.forEach(reg => {
      total += reg.qtdePaletes;
      if (reg.situacao === 'DEVOLVIDO') devolvidos += reg.qtdePaletes;
      else pendentes += reg.qtdePaletes;
      if (reg.situacao === 'PENDENTE EM ATRASO') atrasados += reg.qtdePaletes;
    });
    document.getElementById('pc-total').innerText    = total;
    document.getElementById('pc-devolvido').innerText = devolvidos;
    document.getElementById('pc-pendente').innerText  = pendentes;
    document.getElementById('pc-atraso').innerText    = atrasados;
    document.getElementById('pc-valor').innerText     = formatMoney(atrasados * 35);
  }

  /* ===== EXPORT CSV ===== */
  function exportarCSV() {
    const texto = (document.getElementById('searchInput').value || '').toLowerCase();
    let csv = 'Vale-Palete;Ocorrencia;Plano;Cliente;Motorista;Status Motorista;Placa;Qtde;Valor;Protocolo;Devolucao;Situacao;Link Acao;Solicitacao Luiz\n';
    dadosGlobais.filter(reg => {
      if (filtroStatusVP !== 'TODOS' && reg.situacao !== filtroStatusVP) return false;
      if (texto) {
        const h = [reg.valePalete, reg.motorista, reg.placa, reg.plano, reg.cliente].map(v => String(v||'').toLowerCase()).join(' ');
        return h.includes(texto);
      }
      return true;
    }).forEach(reg => {
      csv += `${reg.valePalete};${formatData(reg.dataOcorrencia)};${reg.plano};${reg.cliente};${reg.motorista};${reg.statusMotorista||'ATIVO'};${reg.placa};${reg.qtdePaletes};${formatMoney(reg.qtdePaletes*35)};${reg.numeroProtocolo};${formatData(reg.dataDevolucao)};${reg.situacao};${reg.linkAcao||''};${reg.solicitacaoLuiz||''}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.setAttribute('href', URL.createObjectURL(blob));
    link.setAttribute('download', 'thx_paletes_export.csv');
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  /* ===== AÇÕES MOTORISTA & TRATATIVA ===== */
  function alterarStatusMotorista(valePalete, selectEl) {
    const novoStatus = selectEl.value;
    selectEl.classList.remove('mot-ativo', 'mot-inativo');
    selectEl.classList.add(novoStatus === 'INATIVO' ? 'mot-inativo' : 'mot-ativo');

    const reg = dadosGlobais.find(r => r.valePalete === valePalete);
    if (reg) reg.statusMotorista = novoStatus;

    google.script.run
      .withSuccessHandler(() => {
        mostrarToast('Status do motorista salvo com sucesso!');
      })
      .withFailureHandler(err => {
        alert('Erro ao salvar status: ' + err);
      })
      .salvarAcompanhamento(valePalete, 'statusMotorista', novoStatus);
  }

  function salvarLinkTratativa(valePalete, valor) {
    const reg = dadosGlobais.find(r => r.valePalete === valePalete);
    if (reg) reg.linkAcao = valor.trim();

    google.script.run
      .withSuccessHandler(() => {
        mostrarToast('Link de tratativa salvo!');
        renderValePaletes();
      })
      .withFailureHandler(err => {
        alert('Erro ao salvar link: ' + err);
      })
      .salvarAcompanhamento(valePalete, 'linkAcao', valor.trim());
  }

  /* ===== MODAL E ENVIO DE E-MAIL AO LUIZ ===== */
  let regParaEnvioLuiz = null;

  function abrirModalEmailLuiz(valePalete) {
    const reg = dadosGlobais.find(r => r.valePalete === valePalete);
    if (!reg) return;
    regParaEnvioLuiz = reg;

    document.getElementById('modal-vp').innerText = reg.valePalete || '-';
    document.getElementById('modal-protocolo').innerText = reg.numeroProtocolo || '-';
    document.getElementById('modal-plano').innerText = reg.plano || '-';
    document.getElementById('modal-cliente').innerText = reg.cliente || '-';
    document.getElementById('modal-motorista').innerText = reg.motorista || '-';
    document.getElementById('modal-placa').innerText = reg.placa || '-';
    document.getElementById('modal-qtde').innerText = (reg.qtdePaletes || 0) + ' paletes';
    document.getElementById('modal-valor').innerText = formatMoney((reg.qtdePaletes || 0) * 35);

    const emailKleber = 'kleber.costa@thxgroup.com.br';
    const emailLuiz = 'luizhenrique@3coracoes.com.br';
    const assunto = `Solicitação de Baixa de Vale-Palete Protocolado — VP: ${reg.valePalete} / Plano: ${reg.plano || '-'} — THX`;
    const corpo = 
`Olá Luiz,

Identificamos que o vale-palete abaixo já foi devidamente protocolado internamente pela THX, porém ainda consta com pendência de devolução no controle da 3 Corações:

• Vale-Palete: ${reg.valePalete}
• Nº Protocolo THX: ${reg.numeroProtocolo || '-'}
• Nº Plano de Viagem: ${reg.plano || '-'}
• Data da Ocorrência: ${formatData(reg.dataOcorrencia)}
• Cliente: ${reg.cliente || '-'}
• Motorista: ${reg.motorista || '-'}
• Placa: ${reg.placa || '-'}
• Quantidade: ${reg.qtdePaletes || 0} paletes
• Valor: ${formatMoney((reg.qtdePaletes || 0) * 35)}

Solicitamos a gentileza de providenciar a baixa/exclusão desta pendência na base da 3 Corações.

Atenciosamente,
Kleber Costa
Controle Operacional de Vale-Paletes — THX Transportes
${emailKleber}`;

    document.getElementById('modal-preview-corpo').innerText = corpo;

    // Link direto do Gmail Web com Kleber em CC
    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(emailLuiz)}&cc=${encodeURIComponent(emailKleber)}&su=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    document.getElementById('modal-btn-gmail').href = gmailUrl;

    // Link mailto padrão com Kleber em CC
    const mailtoUrl = `mailto:${emailLuiz}?cc=${encodeURIComponent(emailKleber)}&subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    document.getElementById('modal-btn-mailto').href = mailtoUrl;

    const btnEnviar = document.getElementById('modal-btn-enviar');
    btnEnviar.disabled = false;
    btnEnviar.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Automático';

    document.getElementById('modalEmailLuiz').style.display = 'flex';
  }

  function registrarEnvioManual() {
    if (!regParaEnvioLuiz) return;
    const vp = regParaEnvioLuiz.valePalete;
    const dataEnvio = new Date().toLocaleString('pt-BR');
    regParaEnvioLuiz.solicitacaoLuiz = dataEnvio;
    google.script.run.salvarAcompanhamento(vp, 'solicitacaoLuiz', dataEnvio);
    setTimeout(() => {
      fecharModalEmailLuiz();
      mostrarToast('✅ E-mail aberto no Gmail/Outlook e marcado como solicitado!');
      renderValePaletes();
      renderProtocolos();
    }, 600);
  }

  function fecharModalEmailLuiz() {
    document.getElementById('modalEmailLuiz').style.display = 'none';
    regParaEnvioLuiz = null;
  }

  function confirmarEnvioEmailLuiz() {
    if (!regParaEnvioLuiz) return;
    const btnEnviar = document.getElementById('modal-btn-enviar');
    btnEnviar.disabled = true;
    btnEnviar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

    const dadosEnvio = {
      valePalete: regParaEnvioLuiz.valePalete,
      plano: regParaEnvioLuiz.plano,
      ocorrencia: formatData(regParaEnvioLuiz.dataOcorrencia),
      cliente: regParaEnvioLuiz.cliente,
      motorista: regParaEnvioLuiz.motorista,
      placa: regParaEnvioLuiz.placa,
      qtdePaletes: regParaEnvioLuiz.qtdePaletes,
      valor: formatMoney((regParaEnvioLuiz.qtdePaletes || 0) * 35),
      numeroProtocolo: regParaEnvioLuiz.numeroProtocolo
    };

    google.script.run
      .withSuccessHandler(res => {
        const resp = JSON.parse(res);
        if (resp.success) {
          if (regParaEnvioLuiz) {
            regParaEnvioLuiz.solicitacaoLuiz = resp.dataEnvio || 'Enviado';
          }
          fecharModalEmailLuiz();
          mostrarToast('✅ E-mail enviado com sucesso para luizhenrique@3coracoes.com.br!');
          renderValePaletes();
          renderProtocolos();
        } else {
          const errStr = String(resp.error || '');
          if (errStr.includes('MailApp') || errStr.includes('permissão') || errStr.includes('script.send_mail')) {
            alert('⚠️ Permissão do Google Necessária:\n\nComo é a primeira vez que o sistema envia e-mails, o Google exige autorizar o script.\n\n👉 Para liberar o envio automático direto: abra o editor do Apps Script e execute a função "autorizarPermissoes" clicando em "Executar" e depois em "Permitir".\n\n👉 Enquanto isso: você pode clicar no botão "Abrir no E-mail" para enviar pelo seu Gmail/Outlook com o texto pronto!');
          } else {
            alert('Erro ao enviar e-mail: ' + resp.error);
          }
          btnEnviar.disabled = false;
          btnEnviar.innerHTML = '<i class="fas fa-paper-plane"></i> Tentar Novamente';
        }
      })
      .withFailureHandler(err => {
        const errStr = String(err || '');
        if (errStr.includes('MailApp') || errStr.includes('permissão') || errStr.includes('script.send_mail')) {
          alert('⚠️ Permissão do Google Necessária:\n\nComo é a primeira vez que o sistema envia e-mails, o Google exige autorizar o script.\n\n👉 Para liberar o envio automático direto: abra o editor do Apps Script e execute a função "autorizarPermissoes" clicando em "Executar" e depois em "Permitir".\n\n👉 Enquanto isso: você pode clicar no botão "Abrir no E-mail" para enviar pelo seu Gmail/Outlook com o texto pronto!');
        } else {
          alert('Erro na comunicação: ' + err);
        }
        btnEnviar.disabled = false;
        btnEnviar.innerHTML = '<i class="fas fa-paper-plane"></i> Tentar Novamente';
      })
      .solicitarBaixaLuiz(dadosEnvio);
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toastNotification');
    if (!toast) return;
    toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
    toast.style.display = 'flex';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 4000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /* ===== CHARTS ===== */
  let chartStatus = null, chartMot = null;

  function renderCharts() {
    const isDark = document.body.classList.contains('dark');
    const textColor = isDark ? '#94a3b8' : '#334155';

    let dev = 0, pendPrazo = 0, atr = 0, pendProt = 0;
    let motData = {};
    dadosGlobais.forEach(r => {
      if (r.situacao === 'DEVOLVIDO')             dev      += r.qtdePaletes;
      if (r.situacao === 'PENDENTE NO PRAZO')      pendPrazo += r.qtdePaletes;
      if (r.situacao === 'PENDENTE EM ATRASO')     atr       += r.qtdePaletes;
      if (r.situacao === 'PENDENTE COM PROTOCOLO') pendProt  += r.qtdePaletes;
      if (r.situacao === 'PENDENTE EM ATRASO') {
        if (!motData[r.motorista]) motData[r.motorista] = 0;
        motData[r.motorista] += r.qtdePaletes;
      }
    });

    if (chartStatus) chartStatus.destroy();
    if (chartMot) chartMot.destroy();

    Chart.defaults.color = textColor;

    const ctx1 = document.getElementById('chartStatusPaletes').getContext('2d');
    chartStatus = new Chart(ctx1, {
      type: 'doughnut',
      data: {
        labels: ['Devolvido', 'No Prazo', 'Em Atraso', 'Com Protocolo'],
        datasets: [{ data: [dev, pendPrazo, atr, pendProt], backgroundColor: ['#22c55e', '#eab308', '#ef4444', '#3b82f6'] }]
      },
      options: { plugins: { title: { display: true, text: 'Status dos Paletes' } } }
    });

    const sortedMot = Object.entries(motData).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const ctx2 = document.getElementById('chartPendenciasMotorista').getContext('2d');
    chartMot = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: sortedMot.map(m => m[0]),
        datasets: [{ label: 'Paletes Atrasados', data: sortedMot.map(m => m[1]), backgroundColor: '#ef4444' }]
      },
      options: { plugins: { title: { display: true, text: 'Top 10 Motoristas c/ Atraso' } } }
    });
  }
</script>
